name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/CodexAutoApprove.Tests.csproj --configuration Release --nologo
      - name: Test all layouts and settings
        shell: pwsh
        run: |
          & ./tests/bin/Release/net10.0-windows/CodexAutoApprove.Tests.exe $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Build complete portable package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          ./scripts/Package.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: CodexAutoApprove-win-x64
          path: |
            publish/*.zip
            publish/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Settings-window-preview
          path: tests/.scratch/ui-preview.png
          if-no-files-found: ignore
          include-hidden-files: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CodexAutoApprove-win-x64
          path: release
      - name: Publish GitHub Release with complete package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --verify-tag --title "Codex Auto Approve $RELEASE_TAG" --generate-notes
